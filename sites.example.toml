# Known sites for multi-site streams (e.g. Wild Africa Live, which rotates
# between WildEarth/Africam camera locations). Coordinates are approximate
# centres of the reserve — refine if you know the precise camera placement.
#
# `aliases` are case-insensitive substrings the OCR resolver matches against
# whatever text it pulls from the on-screen overlay. Add abbreviations,
# alternate spellings, or the name as it actually appears on screen.

