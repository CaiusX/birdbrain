# Persist the journal across reboots.
#
# Default on this image is Storage=auto, which only persists when
# /var/log/journal already exists — it did not, so journald wrote to /run and
# every reboot destroyed the logs. On 2026-07-29 that meant two "crashes" had
# to be reconstructed from detection-table gaps because nothing on the box
# remembered them: no kernel log, no OOM record, no watchdog trace.
#
# Capped so a chatty pipeline can never fill the NVMe.
# MUST be installed as 99-africam-persistent.conf. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf containing
# Storage=volatile, and journald applies drop-ins in FILENAME order across all
# directories — so a 00- prefix loses to the vendor's 40- and the journal stays
# in /run while every config file on disk claims otherwise. Confirm with
# `systemd-analyze cat-config systemd/journald.conf` (last Storage= wins) and
# `journalctl --header` (must show /var/log/journal).
#
# Installed to /etc/systemd/journald.conf.d/ by scripts/apply-net-fixes.sh.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=1month
