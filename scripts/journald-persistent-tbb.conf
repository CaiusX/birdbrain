# Persist the journal on a TBB unit, sized for an SD card.
#
# WHY: a unit's logs are the only record of why it hung or rebooted, and the
# net-watchdog reboots it deliberately after 20 consecutive DNS failures. With a
# volatile journal every one of those reboots destroys the evidence for the thing
# that caused it — which is exactly the hole that forced the 2026-07-29 outage
# investigation to be reconstructed from detection-table gaps instead of logs.
#
# NOTE the failure mode this fixes is subtle: Storage=persistent alone is not
# enough. journald only moves to /var/log/journal at boot or on an explicit
# flush, so a unit that had the directory created after boot keeps writing to
# /run and looks misconfigured when it is not. The installer flushes.
#
# SIZED FOR SD, NOT NVMe: central caps at 500M on an NVMe; a unit gets 200M
# total with granular 20M files, a two-week ceiling, and rate limiting so a
# log-spamming loop cannot grind the card. Journal writes are append-mostly and
# compressed, so this is a modest, bounded amount of wear in exchange for being
# able to diagnose a unit that is 20km away.
#
# Installed to /etc/systemd/journald.conf.d/ by scripts/tbb-finish.sh.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=200M
SystemKeepFree=1G
SystemMaxFileSize=20M
MaxRetentionSec=2week
# A wedged service can emit thousands of lines a second. Cap the burst so the
# card takes a bounded beating rather than an unbounded one.
RateLimitIntervalSec=30s
RateLimitBurst=2000
# Nothing consumes syslog on a unit; skip the duplicate write path.
ForwardToSyslog=no
