# Disable wifi power-save on TinyBirdBrain units.
#
# The Pi Zero 2 W's wifi defaults to power-save ON, which causes intermittent
# drop-offs: the unit silently leaves the LAN (mdns/ssh/web all become "no route
# to host") under light load or idle, and — without the net-watchdog — never
# rejoins until it happens to reboot. Disabling power-save keeps the radio up.
#
# wifi.powersave values: 2 = disable, 3 = enable (NetworkManager).
# Installed by scripts/tbb-finish.sh to /etc/NetworkManager/conf.d/.
[connection]
wifi.powersave = 2
