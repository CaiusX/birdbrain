[project]
name = "africam"
version = "0.1.0"
description = "Real-time bird species recognition from YouTube and IP camera audio streams"
requires-python = ">=3.12"
dependencies = [
    "birdnetlib>=0.18.0",
    # tflite-runtime has no cp312 wheels, so use full tensorflow on every
    # platform; birdnetlib transparently uses tf.lite.Interpreter as fallback.
    "tensorflow>=2.16",
    "librosa>=0.10",
    "resampy>=0.4",
    "numpy>=1.26,<2.0",
    "yt-dlp[default]>=2024.10.7",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "anyio>=4.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    # Required by FastAPI for Form(...) parsing on the site-override endpoint.
    "python-multipart>=0.0.9",
    # Ensures zoneinfo can resolve IANA timezones on Windows (no system DB).
    "tzdata>=2024.1",
    "pillow>=10.3",
    # pytesseract is a thin wrapper that shells out to the system tesseract
    # binary. OCR is gated by config + a runtime check, so the binary is
    # optional — the resolver falls back to manual mode if it's missing.
    "pytesseract>=0.3.10",
    # Background species-note generator. Worker stays dormant if
    # ANTHROPIC_API_KEY isn't set, so the dep loads but doesn't run for
    # users who haven't opted in.
    "anthropic>=0.71",
]

[project.scripts]
africam = "africam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/africam"]

[tool.hatch.build.targets.wheel.force-include]
"src/africam/web/templates" = "africam/web/templates"
"src/africam/web/static" = "africam/web/static"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"src/africam/cli.py" = ["B008"]  # typer uses default-arg call expressions
