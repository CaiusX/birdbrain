{% extends "base.html" %}
{% block title %}Africam · admin{% endblock %}

{% block content %}
<section class="bg-zinc-900 border border-zinc-800 rounded-xl">
  <div class="px-5 py-3 border-b border-zinc-800 flex items-center justify-between flex-wrap gap-3">
    <h2 class="text-sm uppercase tracking-wider text-zinc-400">
      Admin · sources
      <span class="text-zinc-200 ml-2">{{ running }}/{{ total }}</span>
      <span class="text-zinc-500 text-xs ml-1">running</span>
    </h2>
    <button hx-get="/partials/admin" hx-target="#admin-table" hx-swap="outerHTML"
            class="text-xs text-zinc-400 hover:text-zinc-100 px-2 py-0.5 rounded border border-zinc-800 hover:border-zinc-600">
      ↻ refresh
    </button>
  </div>

  {% include "_admin_table.html" %}

  <details class="border-t border-zinc-800 px-5 py-4">
    <summary class="text-xs text-zinc-400 hover:text-zinc-200 cursor-pointer">+ add a live source</summary>
    <p id="add-source-error" class="hidden text-xs text-rose-400 mt-3"></p>
    <form
      hx-post="/api/sources"
      hx-target="#admin-table"
      hx-swap="outerHTML"
      hx-on::after-request="
        const err = document.getElementById('add-source-error');
        if (event.detail.successful) {
          err.classList.add('hidden');
          this.reset();
        } else {
          let msg;
          try {
            const body = JSON.parse(event.detail.xhr.responseText || '{}');
            msg = body.detail || ('HTTP ' + event.detail.xhr.status);
            if (typeof msg !== 'string') msg = JSON.stringify(msg);
          } catch (_) { msg = 'HTTP ' + event.detail.xhr.status; }
          err.textContent = msg;
          err.classList.remove('hidden');
        }
      "
      class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm max-w-3xl">
      <input type="text" name="name" placeholder="short name e.g. Twin Pan" required
             maxlength="64"
             class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 md:col-span-2">
      <input type="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required
             class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 md:col-span-2">
      <div class="grid grid-cols-3 gap-2 md:col-span-2">
        <select name="kind" class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1">
          <option value="youtube">youtube</option>
          <option value="rtsp">rtsp</option>
        </select>
        <input type="number" name="lat" placeholder="lat" step="any"
               class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 tabular-nums">
        <input type="number" name="lon" placeholder="lon" step="any"
               class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 tabular-nums">
      </div>
      <input type="text" name="cookies_file" placeholder="cookies file (optional, for YT auth)"
             value="data/www.youtube.com_cookies.txt"
             class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-xs text-zinc-400 md:col-span-2">
      <input type="text" name="timezone" placeholder="timezone (IANA, e.g. Africa/Johannesburg)"
             value="UTC"
             class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-xs">
      <input type="number" name="min_confidence" placeholder="min conf" step="0.05" min="0.05" max="0.95"
             value="0.3"
             class="bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-xs tabular-nums">
      <label class="flex items-center gap-2 text-xs text-zinc-400 md:col-span-2">
        <input type="checkbox" name="multisite" value="true"> multi-site (rotates between cameras)
      </label>
      <button type="submit"
              class="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-xs font-medium md:col-span-2 md:justify-self-start">
        add source
      </button>
    </form>
  </details>
</section>
{% endblock %}
