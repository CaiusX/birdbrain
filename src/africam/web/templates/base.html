<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Africam{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐦</text></svg>">
  <style>
    .conf-bar { background: linear-gradient(90deg, #16a34a var(--w), transparent var(--w)); }
    /* Leaflet popups inherit a white background by default — match the dark theme. */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #18181b !important; color: #e4e4e7; }
    .leaflet-popup-content { margin: 10px 14px; font-size: 13px; }
    .leaflet-container { background: #0c0c0e; }
    /* Permanent site labels next to each marker. */
    .leaflet-tooltip.site-label {
      background: rgba(24, 24, 27, 0.85);
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      padding: 1px 6px;
      font-size: 11px;
      box-shadow: none;
      white-space: nowrap;
    }
    .leaflet-tooltip.site-label::before { display: none; }

    /* Lock state — maps stay non-interactive until the user clicks them.
       Stops scroll-wheel hijack and accidental marker triggers while
       scrolling the page. The container catches mousedown (our JS uses
       that to remove the lock); all child panes & controls have pointer
       events disabled so nothing inside responds to the lock-breaking
       click either. */
    .leaflet-container.map-locked { cursor: pointer; }
    .leaflet-container.map-locked .leaflet-pane,
    .leaflet-container.map-locked .leaflet-control-container {
      pointer-events: none;
    }
    .leaflet-container.map-locked::after {
      /* Small "click to activate" hint instead of the old centred pill —
         dark circular badge in the lower-right corner. Title attr on the
         container provides a tooltip with the full sentence for clarity. */
      content: "👆";
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid #3f3f46;
      font-size: 13px;
      line-height: 1;
      pointer-events: none;
      z-index: 800;
    }
  </style>
  {% block head_extra %}{% endblock %}
  <script>
    // Shared helper for Leaflet pages — keep a map non-interactive until
    // the user explicitly clicks it. Call lockMap(map) right after L.map().
    // Disables every interaction handler and decorates the container with
    // .map-locked (see CSS above). The first mousedown or touchstart on
    // the container removes the lock and re-enables handlers, so
    // subsequent scrolls/drags/marker clicks work normally.
    //
    // Defined in <head> so it's available before the page's body-inline
    // <script> runs L.map() + lockMap(map).
    window.lockMap = function (map) {
      if (!map || typeof map.getContainer !== 'function') return;
      const handlers = [
        'dragging', 'scrollWheelZoom', 'doubleClickZoom',
        'boxZoom', 'keyboard', 'touchZoom',
      ];
      handlers.forEach(h => { if (map[h]) map[h].disable(); });
      if (map.tap) map.tap.disable();
      const el = map.getContainer();
      el.classList.add('map-locked');
      const prevTitle = el.title;
      el.title = 'Click to interact';
      const enable = () => {
        handlers.forEach(h => { if (map[h]) map[h].enable(); });
        if (map.tap) map.tap.enable();
        el.classList.remove('map-locked');
        el.title = prevTitle;
        el.removeEventListener('mousedown', enable);
        el.removeEventListener('touchstart', enable);
      };
      el.addEventListener('mousedown', enable);
      el.addEventListener('touchstart', enable, { passive: true });
    };
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">
  <header class="sticky top-0 z-40 border-b border-zinc-800 bg-zinc-950/90 supports-[backdrop-filter]:bg-zinc-950/70 backdrop-blur">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-baseline gap-6">
        <a href="/" class="text-lg font-semibold tracking-tight">🐦 Africam Bird</a>
        <nav class="flex items-baseline gap-4 text-sm">
          <a href="/" class="text-zinc-400 hover:text-zinc-100">live</a>
          <a href="/rollup" class="text-zinc-400 hover:text-zinc-100">rollup</a>
          <a href="/species" class="text-zinc-400 hover:text-zinc-100">species</a>
          <a href="/confidence" class="text-zinc-400 hover:text-zinc-100">confidence</a>
          <a href="/review" class="text-zinc-400 hover:text-zinc-100">review</a>
          <a href="/diurnal" class="text-zinc-400 hover:text-zinc-100">diurnal</a>
          {% if not request.state.is_public %}
            <a href="/admin" class="text-zinc-400 hover:text-zinc-100">admin</a>
          {% endif %}
        </nav>
      </div>
      <div class="text-xs text-zinc-500 flex items-center gap-1.5 flex-wrap justify-end">
        <span>data via <a href="https://africam.com/" target="_blank" rel="noopener" class="hover:text-zinc-200">Africam</a></span>
        <span class="text-zinc-700">·</span>
        <span>detection by <a href="https://github.com/kahst/BirdNET-Analyzer" target="_blank" rel="noopener" class="hover:text-zinc-200">BirdNET</a></span>
        <span class="text-zinc-700">·</span>
        <a href="/about" class="hover:text-zinc-200">about</a>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
