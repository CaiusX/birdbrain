# Africam stream roster. Force-added past .gitignore so the Pi deployment
# can `git pull` instead of needing the file scp'd. Each source spins up a
# pipeline worker; supervisor reads this list once at startup, so add a
# source here and restart the `pipeline` service for it to take effect.

# The Africam YouTube cams that used to live here run on the ingest node bne
# since 2026-09-07 (docs/ingest-node.md). They still appear on central as
# external runtime sources — same names, same history — so do not re-add
# them here: central skips external sources, but it would happily run a
# duplicate listed in this file and the two would race.

[[source]]
name = "Djuma"
kind = "rtsp"
url = "rtsp://127.0.0.1:8554/djuma"
lat = -24.787
lon = 31.470
# South Africa — Djuma, Sabi Sand. Audio-only RTSP (AAC 48 kHz stereo): no
# yt-dlp resolve, no cookie to expire. Coordinates are the Gowrie Dam
# waterhole, matching the Djuma entry in sites.example.toml.
#
# Read through the local relay, not the camera. The camera serves exactly one
# client, so whoever connects first locks everyone else out — which meant
# /admin could never audition it. birdbrain-relay holds that single upstream
# connection and re-serves it on loopback; see deploy/relay/. The upstream
# address lives in deploy/relay/mediamtx.yml now.
min_confidence = 0.3
timezone = "Africa/Johannesburg"
